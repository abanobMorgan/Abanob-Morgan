<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="black" stroke-width="4">
  <!-- Human Icon -->
  <circle cx="75" cy="75" r="35" stroke="#000" stroke-width="4" fill="#fde0e0"/>
  <path d="M55 105 Q75 85 95 105" fill="#f77" stroke="none"/>
  <circle cx="75" cy="65" r="10" fill="#fcd2b6"/>

  <!-- Human Speech Bubble -->
  <rect x="130" y="40" rx="10" ry="10" width="120" height="70" fill="#ffe680" stroke="#000" stroke-width="4"/>
  <line x1="140" y1="60" x2="230" y2="60" stroke="#000" stroke-width="4"/>
  <line x1="140" y1="80" x2="200" y2="80" stroke="#000" stroke-width="4"/>

  <!-- Robot Speech Bubble -->
  <rect x="50" y="180" rx="10" ry="10" width="120" height="70" fill="#ffe680" stroke="#000" stroke-width="4"/>
  <line x1="60" y1="200" x2="150" y2="200" stroke="#000" stroke-width="4"/>
  <line x1="60" y1="220" x2="120" y2="220" stroke="#000" stroke-width="4"/>

  <!-- Robot Icon -->
  <circle cx="225" cy="225" r="35" stroke="#000" stroke-width="4" fill="#d9f1ff"/>
  <rect x="210" y="215" width="30" height="15" rx="4" fill="#555"/>
  <circle cx="215" cy="225" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="235" cy="225" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
</svg>
