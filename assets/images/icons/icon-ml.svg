  <circle cx="70" cy="210" r="3" fill="#000"/>
  <circle cx="85" cy="195" r="3" fill="#000"/>
  <circle cx="100" cy="180" r="3" fill="#000"/>

  <!-- Brain Icon -->
  <circle cx="220" cy="210" r="40" stroke="#000" fill="#fff"/>
  <path d="M200 200 Q200 185 215 185 Q230 185 230 200 Q230 215 215 215 Q200 215 200 200 Z" fill="#fcd660" stroke="#000"/>
  <path d="M240 200 Q240 185 255 185 Q270 185 270 200 Q270 215 255 215 Q240 215 240 200 Z" fill="#fcd660" stroke="#000"/>
