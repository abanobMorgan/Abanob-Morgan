  <circle cx="75" cy="45" r="6" fill="#fcd660"/>
  <circle cx="45" cy="75" r="6" fill="#fcd660"/>
  <circle cx="75" cy="75" r="6" fill="#fcd660"/>
  <circle cx="60" cy="60" r="6" fill="#fcd660"/>
  <line x1="45" y1="45" x2="60" y2="60"/>
  <line x1="75" y1="45" x2="60" y2="60"/>
  <line x1="45" y1="75" x2="60" y2="60"/>
  <line x1="75" y1="75" x2="60" y2="60"/>

    <!-- Text Label: MACHINE LEARNING -->
    <rect x="130" y="30" width="130" height="60" rx="10" fill="#fff" stroke="#000"/>
