<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abanob-Morgan</title>
  <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/skills.css">
  <link rel="stylesheet" href="./assets/css/timeline.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <main>
    <!-- SIDEBAR -->
    <aside class="sidebar" data-sidebar>
      <div class="sidebar-info">
        <figure class="avatar-box flip-avatar">
          <div class="flip-inner">
            <img class="flip-front" src="./assets/images/me/main-abanob.png" alt="Abanob Morgan" width="80">
            <img class="flip-back" src="./assets/images/me/abanob.jpg" alt="Abanob Morgan Alt" width="80">
          </div>
        </figure>
        <div class="info-content">
          <h1 class="name" title="Abanob Morgan">Abanob Morgan</h1>
          <p class="title">Machine Learning Engineer </p>
        </div>
        <button class="info_more-btn" data-sidebar-btn>
          <span>Show Contacts</span>
          <ion-icon name="chevron-down"></ion-icon>
        </button>
      </div>
      <div class="sidebar-info_more">
        <div class="separator"></div>
        <ul class="contacts-list">
          <li class="contact-item">
            <div class="icon-box"><ion-icon name="mail-outline"></ion-icon></div>
            <div class="contact-info">
              <p class="contact-title">Email</p>
              <a href="mailto:abanob.k.morgan@gmail.com" class="contact-link">abanob.k.morgan@gmail.com</a>
            </div>
          </li>
          <li class="contact-item">
            <div class="icon-box"><ion-icon name="phone-portrait-outline"></ion-icon></div>
            <div class="contact-info">
              <p class="contact-title">Phone</p>
              <a href="tel:+201027838329" class="contact-link">+2 (010) 2783-8329</a>
            </div>
          </li>
          <li class="contact-item">
            <div class="icon-box"><ion-icon name="calendar-outline"></ion-icon></div>
            <div class="contact-info">
              <p class="contact-title">Birthday</p>
              <time datetime="1996-06-23">June 23, 1996</time>
            </div>
          </li>
          <li class="contact-item">
            <div class="icon-box"><ion-icon name="location-outline"></ion-icon></div>
            <div class="contact-info">
              <p class="contact-title">Location</p>
              <address>New Cairo, Cairo, EGYPT</address>
            </div>
          </li>
        </ul>
        <div class="separator"></div>
        <ul class="social-list">
          <li class="social-item">
            <a href="https://www.linkedin.com/in/abanob-morgan/" class="social-link" target="_blank"
              rel="noopener noreferrer">
              <ion-icon name="logo-linkedin" role="img" class="md hydrated" aria-label="LinkedIn profile"></ion-icon>
            </a>
          </li>
          <li class="social-item">
            <a href="mailto:abanob.k.morgan@gmail.com" class="social-link">
              <ion-icon name="mail-outline" role="img" class="md hydrated" aria-label="Email address"></ion-icon>
            </a>
          </li>
          <li class="social-item">
            <a href="https://github.com/abanobMorgan" class="social-link" target="_blank" rel="noopener noreferrer">
              <ion-icon name="logo-github" role="img" class="md hydrated" aria-label="GitHub profile"></ion-icon>
            </a>
          </li>
          <li class="social-item">
            <a href="https://wa.me/201027838329" class="social-link" target="_blank" rel="noopener noreferrer">
              <ion-icon name="logo-whatsapp" role="img" class="md hydrated" aria-label="WhatsApp contact"></ion-icon>
            </a>
          </li>
        </ul>
      </div>
    </aside>

    <div class="main-content">
      <!-- NAVBAR -->
      <nav class="navbar">
        <ul class="navbar-list">
          <li class="navbar-item">
            <button class="navbar-link active" data-section="about">About</button>
          </li>
          <li class="navbar-item">
            <button class="navbar-link" data-section="resume">Resume</button>
          </li>
          <li class="navbar-item">
            <button class="navbar-link" data-section="portfolio">Portfolio</button>
          </li>
          <li class="navbar-item">
            <button class="navbar-link" data-section="blog">Blog</button>
          </li>
          <li class="navbar-item">
            <button class="navbar-link" data-section="contact">Contact</button>
          </li>
        </ul>
      </nav>


      <!-- Dynamic content will be loaded here -->
      <div id="about-content-section" style="display: none;"></div>
      <div id="resume-content-section" style="display: none;"></div>
      <div id="portfolio-content-section" style="display: none;"></div>
      <div id="blog-content-section" style="display: none;"></div>
      <div id="contact-content-section" style="display: none;"></div>

    </div>
  </main>



  <!-- JS scripts -->
  <script src="./assets/js/generate-env.js"></script>
  <script src="./assets/js/env.js"></script>

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <script src="./assets/js/layout/lazyload.js"></script>

  <script src="./assets/js/script.js"></script>
  <script src="./assets/js/skills.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="./assets/js/contact.js"></script>

  <script src="./assets/js/experience.js"></script>


</body>
